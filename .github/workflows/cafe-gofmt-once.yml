name: Temporary café gofmt
on:
  push:
    branches: [feat/cafe-photobooth-app-mvp]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cafe-photobooth-app-mvp
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Format new module and updated test
        run: |
          gofmt -w $(find internal/modules/cafe -type f -name '*.go') internal/modules/erp/api/contracts.go internal/modules/erp/module.go internal/app/bootstrap.go tests/integration/cafe_app_test.go tests/integration/crm_test.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/modules/cafe internal/modules/erp/api/contracts.go internal/modules/erp/module.go internal/app/bootstrap.go tests/integration/cafe_app_test.go tests/integration/crm_test.go
            git commit -m 'style(cafe): apply gofmt to integrated app'
            git push origin HEAD:feat/cafe-photobooth-app-mvp
          fi
