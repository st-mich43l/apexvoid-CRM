name: Temporary secure-enrollment gofmt
on:
  push:
    branches: [feat/smart-external-registration]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smart-external-registration
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          gofmt -w internal/modules/core/application/external_manifest.go internal/modules/core/application/external_enrollment_crypto_test.go integration/enrollment.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/modules/core/application/external_manifest.go internal/modules/core/application/external_enrollment_crypto_test.go integration/enrollment.go
            git commit -m 'style(enrollment): gofmt signed activation handshake'
            git push origin HEAD:feat/smart-external-registration
          fi
