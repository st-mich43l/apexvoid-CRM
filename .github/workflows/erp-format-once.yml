name: Format ERP integration test (temporary)
on:
  push:
    branches:
      - feat/erp-product-catalog-foundation
permissions:
  contents: write
jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/erp-product-catalog-foundation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          gofmt -w tests/integration/erp_products_test.go
          if ! git diff --quiet -- tests/integration/erp_products_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/integration/erp_products_test.go
            git commit -m "style(erp): format integration regression suite"
            git push origin HEAD:feat/erp-product-catalog-foundation
          fi
