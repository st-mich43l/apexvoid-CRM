name: Format ERP Go changes (temporary)

on:
  push:
    branches:
      - feat/erp-product-catalog-foundation

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/erp-product-catalog-foundation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          gofmt -w $(find internal/modules/erp -name '*.go' -type f)
          if ! git diff --quiet -- internal/modules/erp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/modules/erp
            git commit -m "style(erp): apply gofmt"
            git push origin HEAD:feat/erp-product-catalog-foundation
          fi
