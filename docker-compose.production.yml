# Production-oriented composition. Terminate TLS at an ingress/load balancer
# in front of the frontend service and set APEXVOID_PUBLIC_ORIGIN to its HTTPS
# origin. This file deliberately has no development bind mounts or Vite server.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexvoid}
      POSTGRES_USER: ${POSTGRES_USER:-apexvoid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      DATABASE_PROVISIONER_PASSWORD: ${DATABASE_PROVISIONER_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - apexvoid-data
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_ADDRESS: :6868
      SERVER_CORS_ORIGINS: ${APEXVOID_PUBLIC_ORIGIN:?set the public HTTPS origin in .env.production}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-apexvoid}
      DATABASE_USER: ${POSTGRES_USER:-apexvoid}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      DATABASE_SSLMODE: disable
      DATABASE_PROVISIONING_URL: ${DATABASE_PROVISIONING_URL:?set the dedicated PostgreSQL provisioning URL}
      DATABASE_PROVISIONING_KEY: ${DATABASE_PROVISIONING_KEY:?set a stable 32+ character provisioning encryption key}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: lax
      INTEGRATIONS_ASSERTION_SECRET: ${INTEGRATIONS_ASSERTION_SECRET:?set a 32+ character integration assertion secret}
      INTEGRATIONS_ALLOWED_SERVICE_HOSTS: ${INTEGRATIONS_ALLOWED_SERVICE_HOSTS:?set the trusted service hostnames, for example cafe}
      CONTACTS_UPLOAD_DIR: /var/lib/apexvoid/attachments
      APEXVOID_BOOTSTRAP_ADMIN_EMAIL: ${APEXVOID_BOOTSTRAP_ADMIN_EMAIL:?set a bootstrap administrator email}
      APEXVOID_BOOTSTRAP_ADMIN_USERNAME: ${APEXVOID_BOOTSTRAP_ADMIN_USERNAME:?set a bootstrap administrator username}
      APEXVOID_BOOTSTRAP_ADMIN_PASSWORD: ${APEXVOID_BOOTSTRAP_ADMIN_PASSWORD:?set a strong bootstrap administrator password}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - contacts-data:/var/lib/apexvoid/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6868/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - apexvoid-apps
      - apexvoid-data

  frontend:
    build:
      context: ./web
      target: production
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apexvoid-apps
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  contacts-data:

networks:
  apexvoid-apps:
    name: ${APEXVOID_APPS_NETWORK:-apexvoid-apps}
    external: true
  apexvoid-data:
    name: ${APEXVOID_DATA_NETWORK:-apexvoid-data}
    external: true
