server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://backend:6868;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # This Nginx is reached only through the documented HTTPS ingress. Do not
    # trust client-provided forwarded headers; assert the known external origin.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /health { proxy_pass http://backend:6868/health; }
  location = /ready { proxy_pass http://backend:6868/ready; }
  location / { try_files $uri $uri/ /index.html; }
}
