services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexvoid}
      POSTGRES_USER: ${POSTGRES_USER:-apexvoid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexvoid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-apexvoid}:${POSTGRES_PASSWORD:-apexvoid}@postgres:5432/${POSTGRES_DB:-apexvoid}?sslmode=disable
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  web-node-modules:
