services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexvoid}
      POSTGRES_USER: ${POSTGRES_USER:-apexvoid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexvoid}
      DATABASE_PROVISIONER_PASSWORD: ${DATABASE_PROVISIONER_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - apexvoid-data

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-apexvoid}:${POSTGRES_PASSWORD:-apexvoid}@postgres:5432/${POSTGRES_DB:-apexvoid}?sslmode=disable
      INTEGRATIONS_ASSERTION_SECRET: ${INTEGRATIONS_ASSERTION_SECRET:-}
      INTEGRATIONS_ALLOWED_SERVICE_HOSTS: ${INTEGRATIONS_ALLOWED_SERVICE_HOSTS:-}
      DATABASE_PROVISIONING_URL: ${DATABASE_PROVISIONING_URL:-}
      DATABASE_PROVISIONING_KEY: ${DATABASE_PROVISIONING_KEY:-}
    ports:
      - "${BACKEND_PORT:-6868}:6868"
    volumes:
      - contacts-data:/var/lib/apexvoid/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6868/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - apexvoid-apps
      - apexvoid-data

  frontend:
    build:
      context: ./web
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6868}
      VITE_API_PROXY_TARGET: http://backend:6868
    ports:
      - "${FRONTEND_PORT:-8386}:8386"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apexvoid-apps

volumes:
  postgres-data:
  web-node-modules:
  contacts-data:

networks:
  apexvoid-apps:
    name: ${APEXVOID_APPS_NETWORK:-apexvoid-apps}
    external: true
  apexvoid-data:
    name: ${APEXVOID_DATA_NETWORK:-apexvoid-data}
    external: true
