app:
  name: apexvoid-crm
  environment: development

server:
  address: :6868
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 30s
  shutdown_timeout: 10s
  cors_origins:
    - http://localhost:8386

database:
  url: postgres://USER:PASSWORD@HOST:5432/DATABASE?sslmode=disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

logging:
  level: INFO
