app:
  name: apexvoid-crm
  environment: development

server:
  address: :6868
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 30s
  shutdown_timeout: 10s
  cors_origins:
    - http://localhost:8386

database:
  url: postgres://apexvoid:apexvoid@localhost:5432/apexvoid?sslmode=disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  cookie_secure: false
  cookie_same_site: lax
  password_min_length: 12
  password_max_length: 128

contacts:
  upload_dir: /var/lib/apexvoid/attachments
  max_upload_bytes: 26214400

logging:
  level: INFO
